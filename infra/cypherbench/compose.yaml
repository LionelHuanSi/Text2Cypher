# CypherBench test graphs (image chính thức của tác giả, giống references/cypherbench/docker/docker-compose-test.yml)
# Chỉ mở cổng trên 127.0.0.1. Mật khẩu "cypherbench" là mặc định công khai của benchmark.
# Khác bản gốc: container CHỈ chạy Neo4j. Loader của image giữ cả JSON trong RAM nên bị OOM với
# movie/politics trong VM Docker ~7,6 GB, và báo lỗi làm container tắt nếu DB đã có dữ liệu.
# Dữ liệu được nạp từ host bằng đúng loader.py của image: scripts/cb_load_graph.sh <graph>.
x-neo4j: &neo4j
  image: megagonlabs/neo4j-with-loader:2.4
  entrypoint: ["tini", "-g", "--", "/startup/docker-entrypoint.sh"]
  command: ["neo4j"]
  environment:
    NEO4J_AUTH: neo4j/cypherbench
    NEO4J_server_http__enabled__modules: "TRANSACTIONAL_ENDPOINTS,UNMANAGED_EXTENSIONS,ENTERPRISE_MANAGEMENT_ENDPOINTS"
    NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
services:
  flight-accident:
    <<: *neo4j
    container_name: cypherbench-flight-accident
    volumes:
      - ../../data/cypherbench/raw/graphs/simplekg/flight_accident_simplekg.json:/init/graph.json:ro
    ports:
      - "127.0.0.1:15064:7687"
  nba:
    <<: *neo4j
    container_name: cypherbench-nba
    volumes:
      - ../../data/cypherbench/raw/graphs/simplekg/nba_simplekg.json:/init/graph.json:ro
